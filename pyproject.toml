[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ryujinx-save-manager"
version = "0.1.0"
description = "Local Ryujinx save discovery and management (Phase 0 foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
ryujinx-save-manager = "ryujinx_save_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep one formatter (Ruff). Documentation, complexity, and performance rules
# are reviewed case by case: broad activation adds noise to this small scaffold.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10",
    "ISC", "ICN", "PIE", "PT", "Q", "RET", "SIM", "ARG", "PTH",
    "ERA", "RUF",
]
ignore = ["ISC001"] # Conflicts with the Ruff formatter.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["ryujinx_save_manager"]

[tool.coverage.report]
show_missing = true
